name: Update reversed podcast feed

# Rebuilds feed.xml (newest episode first) from the platform feed,
# every morning after the new episode publishes, plus whenever this
# file itself is changed. Commits feed.xml back to the repo, which is
# served to podcast players at:
# https://raw.githubusercontent.com/vvwt6y2bzd-tech/super-duper-fiesta/main/feed.xml

on:
  push:
    paths:
      - '.github/workflows/update-feed.yml'
  schedule:
    - cron: '30 11 * * *'   # 7:30 AM EDT
    - cron: '30 12 * * *'   # 8:30 AM EDT (backup)
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild feed (newest first)
        run: |
          python3 - <<'PYEOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import format_datetime

          PLATFORM_FEED = "https://muse.ai/podcasts/feed/394970670373556/4bc27f9b-3640-5cc5-9ca9-4f82d93ce1b6"
          SELF_URL = "https://raw.githubusercontent.com/vvwt6y2bzd-tech/super-duper-fiesta/main/feed.xml"
          ATOM_NS = "http://www.w3.org/2005/Atom"
          ITUNES_NS = "http://www.itunes.com/dtds/podcast-1.0.dtd"

          req = urllib.request.Request(PLATFORM_FEED, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=60) as resp:
              xml_bytes = resp.read()

          ET.register_namespace("itunes", ITUNES_NS)
          ET.register_namespace("atom", ATOM_NS)
          root = ET.fromstring(xml_bytes)
          channel = root.find("channel")
          items = channel.findall("item")
          for it in items:
              channel.remove(it)
          for it in reversed(items):  # newest first
              channel.append(it)

          lbd = channel.find("lastBuildDate")
          if lbd is None:
              lbd = ET.SubElement(channel, "lastBuildDate")
          lbd.text = format_datetime(datetime.now(timezone.utc))

          ttl = channel.find("ttl")
          if ttl is None:
              ttl = ET.SubElement(channel, "ttl")
          ttl.text = "60"

          atom_link = channel.find(f"{{{ATOM_NS}}}link")
          if atom_link is not None:
              atom_link.set("href", SELF_URL)

          ET.ElementTree(root).write("feed.xml", encoding="utf-8", xml_declaration=True)
          print(f"Wrote feed.xml: {len(items)} episodes, newest first")
          PYEOF

      - name: Commit feed.xml if changed
        run: |
          git config user.name "podcast-feed-bot"
          git config user.email "podcast-feed-bot@users.noreply.github.com"
          git add feed.xml
          git diff --cached --quiet || git commit -m "Update feed $(date -u +%Y-%m-%d)"
          git push
